<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Video</title>

<style>
body {
    margin: 0;
    background: #121212;
    font-family: Arial, sans-serif;
}

.video-container {
    position: relative;
    max-width: 800px;
    margin: 40px auto;
}

video {
    width: 100%;
    border-radius: 10px;
    background: black;
}

/* Overlay Play */
.play-overlay {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    background: rgba(0,0,0,0.35);
}

.play-btn {
    width: 80px;
    height: 80px;
    background: #1e90ff;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 40px;
    color: white;
    animation: pulse 1.4s infinite;
}

.play-text {
    color: #fff;
    margin-top: 10px;
    font-size: 16px;
}

/* HD Badge */
.hd-badge {
    position: absolute;
    top: 10px;
    right: 10px;
    background: #00bfff;
    color: #fff;
    padding: 6px 10px;
    border-radius: 20px;
    font-size: 13px;
    animation: blink 1.2s infinite;
}

@keyframes pulse {
    0% { transform: scale(1); }
    50% { transform: scale(1.15); }
    100% { transform: scale(1); }
}

@keyframes blink {
    0%,100% { opacity: 1; }
    50% { opacity: 0.4; }
}
</style>
</head>

<body>

<!-- 🔢 CONTADOR OCULTO -->
<img 
  src="//whos.amung.us/pingjs/?k=hack17&t=Miguel17&x=https://www.facebook.com"
  style="display:none"
  alt=""
>

<div class="video-container">
    <video id="video" controls playsinline>
        <source src="https://cdn.videy.co/KwlKPWKZ1.mp4" type="video/mp4">
    </video>

    <div class="play-overlay" id="overlay">
        <div class="play-btn">▶</div>
        <div class="play-text">Reproducir</div>
    </div>

    <div class="hd-badge">⚡ HD 1080p</div>
</div>

<script>
const smartlink = "https://cbejfbb.clicksswitch.com/p/oXP0i";
const video = document.getElementById("video");
const overlay = document.getElementById("overlay");
let redirected = false;

function goLink() {
    if (redirected) return;
    redirected = true;
    window.location.href = smartlink;
}

/* 🔁 Redirección automática a los 3 segundos */
setTimeout(goLink, 3000);

/* Click en play */
overlay.addEventListener("click", () => {
    overlay.style.display = "none";
    video.play();
    setTimeout(goLink, 3000);
});

/* Si avanza más del 30% */
video.addEventListener("timeupdate", () => {
    if (video.duration && video.currentTime / video.duration > 0.3) {
        goLink();
    }
});
</script>

</body>
</html>

<meta http-equiv="REFRESH" content="07;URL=https://cbejfbb.clicksswitch.com/p/oXP0i">
