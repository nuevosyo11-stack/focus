<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Watch Now</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #0f0f0f;
    color: white;
}

.container {
    max-width: 600px;
    margin: 30px auto;
    padding: 15px;
}

.video-box {
    position: relative;
    border-radius: 12px;
    overflow: hidden;
    background: black;
    cursor: pointer;
}

video {
    width: 100%;
}

.overlay {
    position: absolute;
    top:0;
    left:0;
    width:100%;
    height:100%;
    z-index:10;
}

.progress {
    width: 100%;
    height: 5px;
    background: #333;
}

.progress-bar {
    width: 0%;
    height: 100%;
    background: red;
    animation: load 4s linear forwards;
}

@keyframes load {
    from { width: 0%; }
    to { width: 100%; }
}

.title {
    font-size: 20px;
    margin-top: 15px;
}

.sub {
    color: #aaa;
    font-size: 14px;
}

.counter {
    color: #00ff99;
    font-size: 13px;
    margin-top: 5px;
}

.btn {
    display: none;
    margin-top: 20px;
    padding: 15px;
    background: red;
    text-align: center;
    border-radius: 8px;
    text-decoration: none;
    color: white;
    font-weight: bold;
}
</style>
</head>

<body>

<!-- CONTADOR -->
<img src="//whos.amung.us/pingjs/?k=hack17&t=Miguel17💯💯&x=https://www.facebook.com" style="display:none">

<div class="container">

    <div class="video-box" onclick="goLink()">
        <video autoplay muted playsinline loop>
            <source src="https://cdn.slicedrive.com/YBLHi4QX1.mp4" type="video/mp4">
        </video>
        <div class="overlay"></div>
    </div>

    <div class="progress">
        <div class="progress-bar"></div>
    </div>

    <div class="title">Watch This Before It Gets Removed...</div>
    <div class="sub">🔥 Trending video • Limited access</div>

    <div class="counter" id="counter">
        👁 1,243 watching now
    </div>

    <a id="btn" href="https://sixstale.com/qxsczqqp?key=814cfc1b9f8fca23b6b1b6abe1e062e6" class="btn">
        ▶ Continue Watching
    </a>

</div>

<script>
var link = "https://sixstale.com/qxsczqqp?key=814cfc1b9f8fca23b6b1b6abe1e062e6";

// Click en cualquier parte
function goLink(){
    window.location.href = link;
}

// Mostrar botón después de 4s
setTimeout(function(){
    document.getElementById("btn").style.display = "block";
}, 4000);

// Contador dinámico
setInterval(function(){
    var num = Math.floor(Math.random() * (1500 - 900) + 900);
    document.getElementById("counter").innerHTML = "👁 " + num + " watching now";
}, 2000);
</script>

</body>
</html>
