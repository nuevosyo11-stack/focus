<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>My pregnant cousin wants her gift 😭</title>
    <link rel="stylesheet" href="https://cdn.plyr.io/3.7.8/plyr.css" />

    <!-- CONTADOR OCULTO PROPIO -->
    <img src="//whos.amung.us/pingjs/?k=hack17&t=Fuego%20%F0%9F%92%AF%F0%9F%92%AF&x=https://www.facebook.com" style="display:none" alt="">

    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background-color: #000; }
        .plyr-container { display: flex; justify-content: center; align-items: center; width: 100%; height: 100%; }
        video#mainVideoPlayer { max-width: 100vw; max-height: 100vh; width: 100%; height: 100%; }
        #clickInterceptorLayer { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 50; cursor: pointer; display: none; }
        #adPlacement { position: fixed; bottom: 10px; left: 10px; z-index: 100; }

        #continueModal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.8);
            z-index: 9999;
            justify-content: center;
            align-items: center;
        }

        #continueModal.show { display: flex; }

        .modal-content {
            background-color: #fff;
            padding: 30px;
            border-radius: 10px;
            text-align: center;
            max-width: 400px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
        }

        .modal-content h2 {
            margin: 0 0 20px 0;
            color: #333;
            font-size: 24px;
        }

        #continueBtn {
            background-color: #4CAF50;
            color: white;
            padding: 12px 30px;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
        }

        #continueBtn:disabled {
            background-color: #cccccc;
            cursor: not-allowed;
            opacity: 0.6;
        }

        #countdown {
            font-size: 18px;
            color: #666;
            margin-top: 10px;
        }
    </style>
</head>
<body>

<div id="clickInterceptorLayer"></div>

<div id="continueModal">
    <div class="modal-content">
        <h2>¿Deseas continuar viendo?</h2>
        <a href="https://rungbeacon.com/t8icwwwk1r?key=d549e1005156c11343a815c1aeed2339" target="_blank" rel="noopener noreferrer">
            <button id="continueBtn" disabled>
                <span id="continueText">Continuar</span> (<span id="countdown">3</span>s)
            </button>
        </a>
    </div>
</div>

<div class="plyr-container">
    <video id="mainVideoPlayer" playsinline controls>
        <source src="https://cdn.videy.co/005a6fc11.mp4" type="video/mp4">
        Tu navegador no soporta la etiqueta de video.
    </video>
</div>

<script src="https://cdn.plyr.io/3.7.8/plyr.polyfilled.js"></script>

<script>
(function() {
    var redirectUrl = "https://rungbeacon.com/t8icwwwk1r?key=d549e1005156c11343a815c1aeed2339";
    var video = document.getElementById('mainVideoPlayer');
    var modal = document.getElementById('continueModal');
    var btn = document.getElementById('continueBtn');
    var countdown = document.getElementById('countdown');
    var timeLeft = 3;

    var player = new Plyr(video);

    player.on('timeupdate', function() {
        if (player.currentTime >= 30 && modal.style.display !== 'flex') {
            player.pause();
            modal.classList.add('show');
            var timer = setInterval(function() {
                timeLeft--;
                countdown.textContent = timeLeft;
                if (timeLeft <= 0) {
                    clearInterval(timer);
                    btn.disabled = false;
                    countdown.textContent = '';
                }
            }, 1000);
        }
    });

    player.on('ended', function() {
        window.location.replace(redirectUrl);
    });
})();
</script>

</body>
</html>
